    <style>
      body { background-color: #0c0f1d !important; margin: 0; padding: 0; color: white; }
      #root-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #0c0f1d;
        z-index: 9999;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(255,255,255,0.05);
        border-left-color: #22c55e;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#22c55e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <body>
    <div id="root">
      <div id="root-loading">
        <div class="spinner"></div>
        <div style="margin-top: 16px; font-weight: 800; letter-spacing: -0.025em;">LIVEFOOT</div>
      </div>
    </div>
    <script>
      window.addEventListener('error', (e) => {
        console.error('Initial load error:', e);
        
        // Show emergency error UI if root is still empty
        const root = document.getElementById('root');
        if (root && (!root.children.length || document.getElementById('root-loading'))) {
           root.innerHTML = '<div style="padding: 40px; text-align: center; color: white; font-family: sans-serif;">' +
             '<div style="font-size: 40px; margin-bottom: 20px;">⚠️</div>' +
             '<h1 style="font-size: 18px; margin-bottom: 10px;">Erreur de chargement</h1>' +
             '<p style="font-size: 12px; color: #94a3b8; margin-bottom: 20px;">' + (e.message || 'Échec de connexion aux modules') + '</p>' +
             '<button onclick="window.location.reload()" style="background: #22c55e; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;">Réessayer</button>' +
             '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx?v=diag2"></script>
  </body>
</html>
